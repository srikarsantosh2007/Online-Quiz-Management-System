{% extends "base.html" %}

{% block title %}Student Login - Quiz Management System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4><i class="bi bi-person-check"></i> Student Login</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('student_login') }}">
                    <div class="mb-3">
                        <label for="roll_number" class="form-label">Roll Number</label>
                        <input type="text" class="form-control" id="roll_number" name="roll_number" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">Login</button>
                    </div>
                </form>
                <hr>
                <p class="text-center">Don't have an account? <a href="{{ url_for('student_register') }}">Register here</a></p>
                <p class="text-center"><a href="{{ url_for('home') }}">Back to Home</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
