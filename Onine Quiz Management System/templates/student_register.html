{% extends "base.html" %}

{% block title %}Student Register - Quiz Management System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4><i class="bi bi-person-plus"></i> Student Registration</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('student_register') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="roll_number" class="form-label">Roll Number</label>
                        <input type="text" class="form-control" id="roll_number" name="roll_number" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">Register</button>
                    </div>
                </form>
                <hr>
                <p class="text-center">Already have an account? <a href="{{ url_for('student_login') }}">Login here</a></p>
                <p class="text-center"><a href="{{ url_for('home') }}">Back to Home</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
