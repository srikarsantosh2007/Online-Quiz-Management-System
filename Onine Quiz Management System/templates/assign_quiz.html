{% extends "base.html" %}

{% block title %}Assign Quiz - Quiz Management System{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('admin_dashboard') }}">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('admin_quizzes') }}">Quizzes</a></li>
                <li class="breadcrumb-item active">Assign Quiz</li>
            </ol>
        </nav>
    </div>
</div>

<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header">
                <h4><i class="bi bi-share"></i> Assign Quiz to Students</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('assign_quiz') }}">
                    <div class="mb-3">
                        <label for="quiz_id" class="form-label">Select Quiz</label>
                        <select class="form-select" id="quiz_id" name="quiz_id" required>
                            <option value="">Select a quiz</option>
                            {% for quiz in quizzes %}
                            <option value="{{ quiz.id }}">{{ quiz.title }} ({{ quiz.duration }} mins, {{ quiz.total_marks }} marks)</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Select Students</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                            <label class="form-check-label" for="selectAll">Select All</label>
                        </div>
                        <div class="border p-3 rounded mt-2" style="max-height: 300px; overflow-y: auto;">
                            {% for student in students %}
                            <div class="form-check">
                                <input class="form-check-input student-checkbox" type="checkbox" name="student_ids" value="{{ student.id }}" id="student_{{ student.id }}">
                                <label class="form-check-label" for="student_{{ student.id }}">
                                    {{ student.name }} ({{ student.roll_number }})
                                </label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Assign Quiz</button>
                        <a href="{{ url_for('admin_quizzes') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function toggleSelectAll() {
    const selectAll = document.getElementById('selectAll');
    const checkboxes = document.querySelectorAll('.student-checkbox');
    checkboxes.forEach(checkbox => {
        checkbox.checked = selectAll.checked;
    });
}
</script>
{% endblock %}
